<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Isometric CGI Floorplan Stack</title>
<style>
  :root { --bg:#111317; --panel:#1c1f26; --accent:#3b82f6; --text:#f3f4f6; --muted:#9ca3af; --spacing:0px; --shadow:0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  header { background:var(--panel); border-bottom:1px solid #2d313c; padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; z-index:10; }
  h1 { font-size:14px; white-space:nowrap; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  button { background:#272b36; color:var(--text); border:1px solid #383e4d; padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
  button:hover { background:#323746; }
  button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .slider-wrap { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-left:4px; }
  .slider-val { min-width:36px; color:var(--text); font-variant-numeric:tabular-nums; }
  input[type="range"] { accent-color:var(--accent); cursor:pointer; width:110px; }
  .zoom-wrap { display:flex; align-items:center; gap:4px; margin-left:4px; }
  .zoom-wrap button { padding:6px 9px; font-weight:600; }
  main { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; touch-action:none; cursor:grab; }
  main:active { cursor:grabbing; }
  .viewport { display:flex; align-items:center; justify-content:center; transform-origin:center center; will-change:transform; }
  .stack { position:relative; width:min(94vw, 72dvh, 720px); height:min(94vw, 72dvh, 720px); pointer-events:none; }
  .layer { position:absolute; inset:0; transition:opacity 0.3s ease, filter 0.3s ease; }
  .layer img { width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 14px 24px rgba(0,0,0,var(--shadow))); user-select:none; -webkit-user-drag:none; }
  .layer.dimmed { opacity:0; filter:grayscale(100%); }
  @media (max-width: 640px) {
    header { padding:8px 12px; gap:8px; }
    h1 { width:100%; font-size:13px; }
    .controls { width:100%; justify-content:space-between; }
    .slider-wrap { flex:1; min-width:160px; }
    input[type="range"] { flex:1; width:auto; }
    .stack { width:min(96vw, 68dvh); height:min(96vw, 68dvh); }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding:6px 12px; flex-wrap:nowrap; }
    h1 { display:none; }
    .controls { width:100%; justify-content:space-between; }
    .stack { width:min(90vw, 80dvh); height:min(90vw, 80dvh); }
  }
</style>
</head>
<body>
  <header>
    <!-- STEP 1: Edit the building title below -->
    <h1>Isometric CGI Stack</h1>

    <div class="controls">
      <!-- STEP 2: FLOOR FILTER BUTTONS
           - Keep "All Floors" (data-floor="all") first.
           - Add or remove floor buttons below.
           - The data-floor number (0, 1, 2, 3...) MUST match the order of your images in STEP 3 (0 = bottom/Ground Floor). -->
      <button class="floor-btn active" data-floor="all">All Floors</button>
      <button class="floor-btn" data-floor="0">Ground Floor</button>
      <button class="floor-btn" data-floor="1">First Floor</button>
      <!--<button class="floor-btn" data-floor="2">Roof</button> -->
      <!-- Example for a 3-storey house + roof:
      <button class="floor-btn" data-floor="0">Ground Floor</button>
      <button class="floor-btn" data-floor="1">First Floor</button>
      <button class="floor-btn" data-floor="2">Second Floor</button>
      <button class="floor-btn" data-floor="3">Roof</button>
      -->

      <div class="slider-wrap">
        <span>Spacing:</span>
        <!-- Tip: Increase max="250" to max="350" if you have 4+ floors so they have plenty of room to rise -->
        <input type="range" id="rng" min="0" max="250" value="0">
        <span class="slider-val" id="val">0px</span>
      </div>
      <div class="zoom-wrap">
        <button id="zOut" title="Zoom Out">−</button>
        <button id="zReset" title="Reset View">100%</button>
        <button id="zIn" title="Zoom In">+</button>
      </div>
    </div>
  </header>

  <main id="stage">
    <div class="viewport" id="vp">
      <!-- STEP 3: FLOOR IMAGE LAYERS (Listed from BOTTOM to TOP)
           - The 1st image (index 0) is ALWAYS anchored/fixed at 0px when sliding.
           - Each image listed below it automatically stacks on top and rises upward by (index * spacing).
           - Remember: GitHub filenames are case-sensitive (e.g., GF.png vs gf.png). -->
      <div class="stack" id="stk">
        <div class="layer"><img src="GF.png" alt="Ground Floor"></div>
        <div class="layer"><img src="FF.png" alt="First Floor"></div>
        <div class="layer"><img src="Roof.png" alt="Roof"></div>
      </div>
    </div>
  </main>

  <script>
    // NO EDITS NEEDED BELOW THIS LINE — JavaScript automatically detects how many layers you added in STEP 3
    const rng = document.getElementById("rng"), val = document.getElementById("val");
    const stage = document.getElementById("stage"), vp = document.getElementById("vp");
    const layers = [...document.querySelectorAll(".layer")];
    const floorBtns = [...document.querySelectorAll(".floor-btn")];

    // Automatically assign z-index and upward vertical offset (Index 0 stays fixed at 0px)
    layers.forEach((layer, index) => {
      layer.style.zIndex = index + 1;
      layer.style.transform = index === 0 ? "translateY(0px)" : `translateY(calc(var(--spacing) * -${index}))`;
    });

    // Floor isolation filter buttons
    floorBtns.forEach(btn => {
      btn.onclick = () => {
        floorBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.dataset.floor;
        layers.forEach((layer, index) => {
          layer.classList.toggle("dimmed", target !== "all" && Number(target) !== index);
        });
      };
    });

    // Smooth vertical spacing slider
    rng.oninput = () => {
      const n = +rng.value;
      val.textContent = n + "px";
      document.documentElement.style.setProperty("--spacing", n + "px");
      document.documentElement.style.setProperty("--shadow", (Math.min(n / 60, 1) * 0.45).toFixed(2));
    };

    // Zoom & pan navigation
    let scale = 1, tx = 0, ty = 0;
    const pts = new Map();
    let lastDist = 0, lastMid = null;
    const applyTransform = () => {
      vp.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      zReset.textContent = Math.round(scale * 100) + "%";
    };
    const setZoom = (next, cx = 0, cy = 0) => {
      const prev = scale;
      scale = Math.min(Math.max(next, 0.75), 4);
      const ratio = scale / prev;
      tx = cx - (cx - tx) * ratio;
      ty = cy - (cy - ty) * ratio;
      if (scale === 1 && Math.abs(tx) < 5 && Math.abs(ty) < 5) { tx = 0; ty = 0; }
      applyTransform();
    };
    zIn.onclick = () => setZoom(scale + 0.35);
    zOut.onclick = () => setZoom(scale - 0.35);
    zReset.onclick = () => { scale = 1; tx = 0; ty = 0; applyTransform(); };
    stage.ondblclick = () => { scale = 1; tx = 0; ty = 0; applyTransform(); };
    stage.addEventListener("wheel", e => {
      e.preventDefault();
      const rect = stage.getBoundingClientRect();
      const cx = e.clientX - (rect.left + rect.width / 2);
      const cy = e.clientY - (rect.top + rect.height / 2);
      setZoom(scale * (e.deltaY < 0 ? 1.12 : 0.89), cx, cy);
    }, { passive: false });

    stage.onpointerdown = e => {
      stage.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      lastDist = 0; lastMid = null;
    };
    stage.onpointermove = e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) {
        tx += e.clientX - prev.x;
        ty += e.clientY - prev.y;
        applyTransform();
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        const rect = stage.getBoundingClientRect();
        const mid = { x: (a.x + b.x) / 2 - (rect.left + rect.width / 2), y: (a.y + b.y) / 2 - (rect.top + rect.height / 2) };
        if (lastDist > 0 && lastMid) {
          tx += mid.x - lastMid.x;
          ty += mid.y - lastMid.y;
          setZoom(scale * (dist / lastDist), mid.x, mid.y);
        }
        lastDist = dist; lastMid = mid;
      }
    };
    const endPtr = e => { pts.delete(e.pointerId); lastDist = 0; lastMid = null; };
    stage.onpointerup = endPtr;
    stage.onpointercancel = endPtr;
  </script>
</body>
</html>
